# SVD++ with Attention and Gating Configuration
# =============================================

model:
  embedding_dim: 256

training:
  batch_size: 1024
  learning_rate: 0.001
  reg_lambda: 0.01
  num_epochs: 40
  num_workers: 2

early_stopping:
  patience: 5
  min_delta: 0.0001

scheduler:
  factor: 0.5
  patience: 3
  min_lr: 0.000001

data:
  test_size: 0.1
  validation_size: 0.1
  random_state: 42

output:
  model_file: "svdpp_ag_model.pth"
